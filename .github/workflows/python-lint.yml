name: Python Lint Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'

jobs:
  lint:
    name: Lint Python Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Get changed Python files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR 事件：比较 base 和 head
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.py$' > changed_files.txt || true
          else
            # Push 事件：比较最近两次提交
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep -E '\.py$' > changed_files.txt || true
          fi
          
          if [ -s changed_files.txt ]; then
            echo "has_python_changes=true" >> $GITHUB_OUTPUT
            echo "Changed Python files:"
            cat changed_files.txt
          else
            echo "has_python_changes=false" >> $GITHUB_OUTPUT
            echo "No Python files changed"
          fi
      
      - name: Install linting tools
        if: steps.changed-files.outputs.has_python_changes == 'true'
        run: |
          pip install --upgrade pip
          pip install ruff flake8
      
      - name: Run Ruff linter
        if: steps.changed-files.outputs.has_python_changes == 'true'
        continue-on-error: true
        run: |
          if [ -s changed_files.txt ]; then
            echo "Running Ruff linter on changed files..."
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Linting $file with Ruff..."
                ruff check "$file"
              fi
            done < changed_files.txt
          fi
      
      - name: Run Flake8
        if: steps.changed-files.outputs.has_python_changes == 'true'
        continue-on-error: true
        run: |
          if [ -s changed_files.txt ]; then
            echo "Running Flake8 on changed files..."
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Checking $file with Flake8..."
                flake8 "$file"
              fi
            done < changed_files.txt
          fi
      
      - name: Lint Summary
        if: steps.changed-files.outputs.has_python_changes == 'true'
        run: |
          echo "Python lint check completed for changed files"
